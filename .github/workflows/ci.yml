name: CI

on:
  pull_request:
  push:
    branches: [main]

# Limit GITHUB_TOKEN to read-only — this workflow only installs deps, builds,
# and runs tests. Nothing it does requires write access. Closes CodeQL
# actions/missing-workflow-permissions (alert #4 on the public mirror).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
