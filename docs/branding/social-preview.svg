<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social preview card for mainion-ai/memory-kernel.

  Dimensions: 1280 × 640 (GitHub's recommended size for best display
  across thumbnail surfaces — Twitter unfurl, LinkedIn, Slack, etc.).

  Safe area: 80pt inset from each edge — comfortable margin above
  GitHub's recommended 40pt minimum, so nothing important gets
  clipped on aggressive crops.

  Export to PNG:
    - macOS: open in Safari/Chrome, take a 1280×640 screenshot, or:
        rsvg-convert -w 1280 -h 640 social-preview.svg -o social-preview.png
        (install via: brew install librsvg)
    - Cross-platform: any browser -> right-click -> "Save as image",
      or open at https://cloudconvert.com/svg-to-png with target 1280×640.

  Upload path: Settings -> General -> Social preview -> Edit -> Upload.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 640"
     width="1280" height="640">

  <defs>
    <!-- Subtle event-stream dot pattern in the background; evokes
         events.ndjson without being literal -->
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1F2A37" />
    </pattern>
    <!-- Vignette fade so the dots are subtle near the centre -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1419" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0F1419" stop-opacity="0.45" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0F1419" />
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.6" />
  <rect width="1280" height="640" fill="url(#vignette)" />

  <!-- Title -->
  <text x="640" y="265"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="108" font-weight="700"
        fill="#E6EDF3" text-anchor="middle"
        letter-spacing="-2">memory-kernel</text>

  <!-- Tagline -->
  <text x="640" y="345"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="38" font-weight="400"
        fill="#9CA3AF" text-anchor="middle">Persistent, file-first memory for AI agents</text>

  <!-- Event-stream motif: a horizontal row of "atoms" fading right,
       suggesting the append-only event log + the atom abstraction.
       Total width of the row = 7*28 + 6*16 = 292. Centred at x=640
       means start x = 494. -->
  <g transform="translate(494, 440)">
    <rect x="0"   y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.95" />
    <rect x="44"  y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.80" />
    <rect x="88"  y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.62" />
    <rect x="132" y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.45" />
    <rect x="176" y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.30" />
    <rect x="220" y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.18" />
    <rect x="264" y="0" width="28" height="28" rx="5" fill="#7EE787" opacity="0.10" />
  </g>

  <!-- Footer: project metadata -->
  <text x="640" y="565"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, system-ui, sans-serif"
        font-size="22" font-weight="500"
        fill="#6B7280" text-anchor="middle"
        letter-spacing="0.5">mainion-ai/memory-kernel  ·  Apache-2.0  ·  npm i memory-kernel</text>
</svg>
